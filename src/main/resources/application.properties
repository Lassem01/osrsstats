spring.application.name=osrsstats

# Port: Railway gir $PORT automatisk, lokalt brukes 8080
server.port=${PORT:8080}

# Database: bruker Railway-variabler hvis de finnes, ellers lokal Docker/IntelliJ.
# Hver ${VAR:fallback} betyr "bruk miljovariabelen hvis satt, ellers fallback".
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/osrsstats}
spring.datasource.username=${PGUSER:osrs}
spring.datasource.password=${PGPASSWORD:osrs}

# Hibernate lager/oppdaterer tabellene automatisk ut fra entitetene
spring.jpa.hibernate.ddl-auto=update

# Caching (Caffeine): maks 100 oppforinger, hver lever i 10 minutter
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m