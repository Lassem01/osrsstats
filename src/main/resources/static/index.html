<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mattox – Group Ironman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1612;
            --panel: #2a2218;
            --panel-light: #342a1d;
            --border: #4a3c28;
            --gold: #d4af37;
            --gold-bright: #ffd700;
            --text: #e8dcc8;
            --text-dim: #9a8d76;
            --leader: #3a5a3a;
            --leader-glow: rgba(120, 200, 120, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            background-image:
                    radial-gradient(circle at 30% 10%, rgba(212,175,55,0.06) 0%, transparent 50%),
                    radial-gradient(circle at 70% 90%, rgba(212,175,55,0.04) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 60px;
        }

        header {
            text-align: center;
            padding: 44px 20px 28px;
            border-bottom: 1px solid var(--border);
        }
        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(2.2rem, 6vw, 3.4rem);
            color: var(--gold);
            letter-spacing: 0.04em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .badge-gim {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 14px;
            border: 1px solid var(--gold);
            border-radius: 20px;
            color: var(--gold);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        button {
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            background: var(--panel-light);
            color: var(--gold);
            border: 1px solid var(--border);
            padding: 9px 20px;
            border-radius: 6px;
            font-size: 0.92rem;
            font-weight: 600;
            transition: background 0.2s, border-color 0.2s;
        }
        button:hover { background: var(--border); border-color: var(--gold); }
        .updated { color: var(--text-dim); font-size: 0.85rem; }

        .wrap {
            max-width: 1280px;
            margin: 32px auto 0;
            padding: 0 20px;
        }

        /* ---- Leaderboard ---- */
        .leaderboard {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 26px 28px;
            margin-bottom: 36px;
            box-shadow: 0 8px 24px -12px rgba(0,0,0,0.6);
        }
        .lb-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 20px;
        }
        .lb-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--gold-bright);
        }
        .lb-tabs { display: flex; gap: 8px; }
        .lb-tab {
            padding: 7px 16px;
            font-size: 0.88rem;
        }
        .lb-tab.active {
            background: var(--gold);
            color: var(--bg);
            border-color: var(--gold);
        }
        .lb-rows { display: flex; flex-direction: column; gap: 10px; }
        .lb-row {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--panel-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
        }
        .lb-rank {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.3rem;
            width: 32px;
            text-align: center;
            color: var(--text-dim);
        }
        .lb-row.first .lb-rank { color: var(--gold-bright); }
        .lb-row.first { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
        .lb-name { flex: 1; font-weight: 600; font-size: 1.05rem; }
        .lb-xp {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            color: #b6e6b6;
            font-size: 1.05rem;
        }
        .lb-xp.zero { color: var(--text-dim); font-weight: 500; }
        .lb-note {
            margin-top: 16px;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-style: italic;
            text-align: center;
        }

        /* ---- Spillerkort ---- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px -12px rgba(0,0,0,0.6);
        }
        .card-head {
            background: var(--panel-light);
            padding: 18px 20px;
            border-bottom: 2px solid var(--gold);
        }
        .card-name {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--gold-bright);
        }
        .card-total { color: var(--text-dim); font-size: 0.9rem; margin-top: 2px; }
        .card-total strong { color: var(--text); font-size: 1.05rem; }

        .skills { padding: 8px 0; }
        .skill-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 20px;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(74,60,40,0.3);
        }
        .skill-row:last-child { border-bottom: none; }
        .skill-name { color: var(--text-dim); }
        .skill-level {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .skill-row.leader { background: linear-gradient(90deg, var(--leader-glow), transparent); }
        .skill-row.leader .skill-level { color: #b6e6b6; }
        .crown { font-size: 0.85rem; }

        .total-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: rgba(212,175,55,0.06);
            font-weight: 700;
        }
        .total-row.leader { background: linear-gradient(90deg, var(--leader-glow), transparent); }
        .total-row .skill-name { color: var(--gold); }

        .error { padding: 30px 20px; text-align: center; color: #d88; font-size: 0.9rem; }
        .loading { text-align: center; padding: 80px 20px; color: var(--text-dim); font-size: 1.1rem; }

        .section-label {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--gold);
            margin: 0 0 18px;
        }
    </style>
</head>
<body>
<header>
    <h1>Mattox</h1>
    <div class="badge-gim">⚔ Group Ironman</div>
    <div class="controls">
        <button onclick="refreshAll()">↻ Oppdater</button>
        <span class="updated" id="updated"></span>
    </div>
</header>

<div class="wrap">
    <!-- Leaderboard -->
    <div class="leaderboard">
        <div class="lb-head">
            <div class="lb-title">🏆 XP-leaderboard</div>
            <div class="lb-tabs">
                <button class="lb-tab active" data-days="7" onclick="setPeriod(7, this)">Denne uken</button>
                <button class="lb-tab" data-days="30" onclick="setPeriod(30, this)">Denne måneden</button>
            </div>
        </div>
        <div class="lb-rows" id="lbRows">
            <div class="loading" style="padding: 30px;">Laster...</div>
        </div>
        <div class="lb-note">
            Stats lagres automatisk én gang i døgnet. XP-gevinsten regnes ut fra
            disse daglige målingene og blir mer presis etter hvert som dagene går.
        </div>
    </div>

    <!-- Spillerkort -->
    <h2 class="section-label">Stats</h2>
    <div id="content" class="loading">Henter stats...</div>
</div>

<script>
    const STATS_API = '/api/stats';
    const LB_API = '/api/leaderboard';
    let currentDays = 7;

    document.addEventListener('DOMContentLoaded', () => {
        loadStats();
        loadLeaderboard();
    });

    // Trykk på "Hent ferske tall" → henter live-stats til visning og oppdaterer
    // leaderboardet. Selve historikken lagres av den daglige jobben i backend.
    async function refreshAll() {
        await loadStats();
        await loadLeaderboard();
    }

    async function loadStats() {
        const content = document.getElementById('content');
        content.className = 'loading';
        content.innerHTML = 'Henter stats...';
        try {
            const res = await fetch(STATS_API);
            if (!res.ok) throw new Error('Kunne ikke hente stats');
            const players = await res.json();
            renderCards(players);
            document.getElementById('updated').textContent =
                'Oppdatert ' + new Date().toLocaleTimeString('no-NO');
        } catch (err) {
            content.className = 'error';
            content.innerHTML = 'Feil ved henting: ' + err.message;
        }
    }

    async function loadLeaderboard() {
        const rows = document.getElementById('lbRows');
        try {
            const res = await fetch(`${LB_API}?days=${currentDays}`);
            if (!res.ok) throw new Error('Kunne ikke hente leaderboard');
            const entries = await res.json();
            renderLeaderboard(entries);
        } catch (err) {
            rows.innerHTML = `<div class="error">Feil: ${err.message}</div>`;
        }
    }

    function setPeriod(days, btn) {
        currentDays = days;
        document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        loadLeaderboard();
    }

    function renderLeaderboard(entries) {
        const rows = document.getElementById('lbRows');
        if (!entries.length) {
            rows.innerHTML = '<div class="error">Ingen data ennå.</div>';
            return;
        }
        rows.innerHTML = entries.map((e, i) => `
      <div class="lb-row ${i === 0 && e.xpGained > 0 ? 'first' : ''}">
        <div class="lb-rank">${i + 1}</div>
        <div class="lb-name">${escapeHtml(e.username)}</div>
        <div class="lb-xp ${e.xpGained === 0 ? 'zero' : ''}">
          ${e.xpGained > 0 ? '+' : ''}${e.xpGained.toLocaleString('no-NO')} XP
        </div>
      </div>
    `).join('');
    }

    function renderCards(players) {
        const content = document.getElementById('content');

        // Finn hvem som leder i hver ferdighet
        const leaders = {};
        players.forEach(p => {
            if (!p.found) return;
            p.skills.forEach(s => {
                const best = leaders[s.name];
                if (!best || s.level > best.level || (s.level === best.level && s.xp > best.xp)) {
                    leaders[s.name] = { level: s.level, xp: s.xp, player: p.username };
                }
            });
        });

        content.className = '';
        content.innerHTML = '<div class="cards">' +
            players.map(p => card(p, leaders)).join('') + '</div>';
    }

    function card(p, leaders) {
        if (!p.found) {
            return `
        <div class="card">
          <div class="card-head"><div class="card-name">${escapeHtml(p.username)}</div></div>
          <div class="error">Fant ingen stats for denne kontoen.<br>Sjekk at navnet er riktig.</div>
        </div>`;
        }

        const overall = p.skills.find(s => s.name === 'Overall');
        const rest = p.skills.filter(s => s.name !== 'Overall');
        const overallLeader = leaders['Overall'] && leaders['Overall'].player === p.username;

        const rows = rest.map(s => {
            const isLeader = leaders[s.name] && leaders[s.name].player === p.username;
            return `
        <div class="skill-row ${isLeader ? 'leader' : ''}">
          <span class="skill-name">${s.name}</span>
          <span class="skill-level">${isLeader ? '<span class="crown">👑</span>' : ''}${s.level}</span>
        </div>`;
        }).join('');

        return `
      <div class="card">
        <div class="card-head">
          <div class="card-name">${escapeHtml(p.username)}</div>
          <div class="card-total">Totalnivå: <strong>${overall ? overall.level : '–'}</strong></div>
        </div>
        <div class="total-row ${overallLeader ? 'leader' : ''}">
          <span class="skill-name">Total XP</span>
          <span class="skill-level">${overallLeader ? '<span class="crown">👑</span>' : ''}${overall ? overall.xp.toLocaleString('no-NO') : '–'}</span>
        </div>
        <div class="skills">${rows}</div>
      </div>`;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
